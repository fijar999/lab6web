<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <title>Praktikum DOM dan Event</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <p id="pesan">Belum ada tindakan.</p>

    <p>Jumlah karakter: <span id="jumlahKarakter">0</span></p>

    <form id="formPendaftaran" novalidate>

        <br><br>

        <label for="email">Email</label>
        <input id="email" name="email" type="email">
        <br><br>

        <label for="usia">Usia</label>
        <input id="usia" name="usia" type="number" min="17" max="100">
        <br><br>
        <button type="submit">Daftar</button>
        <button type="submit"daftar></button>
    </form>
    <p id="pesanForm" aria-live="polite"></p>


    <P ID="teksgaya">
        Ini adala paragraf untuk latihan perubahan gaya
    </P>
    <button id="tombolgaya" type="button">
        ubah gaya
    </button>

    <section>
        <h2>penghitung karakter</h2>

        <input type="text" id="namainput" maxlegth="40">
        <p>
            jumlah karakter:
            <span id="jumlahkarakter">0</span>
        </p>
    </section>

    <section>
        <h2>Daftar Tugas</h2>

        <ul id="daftarTugas"></ul>
    </section>

</body>
</html>
